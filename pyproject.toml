[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pubg-audio"
version = "0.1.0"
description = "Binaural SELD paper architecture and trajectory audio research"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2", "torch>=2.8,<2.9"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
pubg-audio-train = "pubg_audio.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
